{% extends 'tasks/base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<div class="delete-card">
    <div class="warning-icon">🗑️</div>
    <h1>Delete Task?</h1>
    <p>Are you sure you want to delete <strong>"{{ task.title }}"</strong>?<br>This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions" style="justify-content:center;">
            <button class="btn btn-danger" type="submit">Yes, delete</button>
            <a class="btn btn-secondary" href="{% url 'task_list' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
