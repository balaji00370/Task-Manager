{% extends 'tasks/base.html' %}

{% block title %}Delete task{% endblock %}

{% block content %}
    <h1>Delete task?</h1>
    <p>Are you sure you want to delete "{{ task.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button class="danger" type="submit">Yes, delete</button>
        <a href="{% url 'task_list' %}">Cancel</a>
    </form>
{% endblock %}
